name: mini_foot_owner_flutter
description: "MiniFoot Owner — App de gestion pour propriétaires de terrains"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  # Traduit les widgets Material (sélecteurs de date/heure, menu copier-coller).
  # Sans elle, ils s'affichent en anglais dans une app entièrement française.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  lottie: ^3.1.0
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  phosphoricons_flutter: ^1.0.0
  latlong2: ^0.9.1
  flutter_dotenv: ^5.2.1
  geolocator: ^13.0.2
  http: ^1.2.2
  http_parser: ^4.0.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  mobile_scanner: ^7.2.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_svg: ^2.2.4
  shared_preferences: ^2.2.3
  # ^0.20.2 imposé par flutter_localizations du SDK
  intl: ^0.20.2
  skeletonizer: ^2.1.3
  connectivity_plus: ^7.3.1
  flutter_slidable: ^4.0.3
  flutter_image_compress: ^2.5.1
  google_fonts: ^6.2.1
  # Ouvrir les réglages système quand la caméra est bloquée (design écran 24) :
  # sans ce raccourci, le check-in devient inutilisable sans explication.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/minifoot.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/minifoot.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - .env

  # `assets/fonts/` n'est plus livré comme dossier d'assets : les polices sont
  # embarquées par la section `fonts` ci-dessous, les dupliquer en assets ne
  # servait à rien.
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
